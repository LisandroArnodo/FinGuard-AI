services:

  postgres:
    image: postgres:16
    container_name: fingard-postgres

    environment:
      POSTGRES_USER: fingard_user
      POSTGRES_PASSWORD: fingard_password
      POSTGRES_DB: fraud_database

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: